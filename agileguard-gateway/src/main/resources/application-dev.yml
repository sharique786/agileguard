# ============================================================
# AgileGuard — API Gateway  |  DEVELOPMENT environment
# Activated by: -Dspring.profiles.active=dev
#
# Purpose : Shared sandbox for the development team.
#           Services run inside the dev Kubernetes namespace
#           (or a docker-compose stack).
# ============================================================
spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"          # local Angular dev
              - "https://dev.agileguard.example.com"  # deployed dev UI
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://agileguard-auth:8081       # docker-compose / k8s service name
          predicates: [Path=/api/auth/**, /api/tenants/**, /api/projects/**]
          filters: [StripPrefix=0]
        - id: onboarding-service
          uri: http://agileguard-auth:8081
          predicates: [Path=/api/onboarding/**]
          filters: [StripPrefix=0]
        - id: admin-service
          uri: http://agileguard-auth:8081
          predicates: [Path=/api/admin/**]
          filters: [StripPrefix=0]
        - id: jira-service
          uri: http://agileguard-jira:8082
          predicates: [Path=/api/jira/**]
          filters: [StripPrefix=0]
        - id: ai-service
          uri: http://agileguard-ai:8083
          predicates: [Path=/api/ai/**]
          filters: [StripPrefix=0]
        - id: github-service
          uri: http://agileguard-github:8084
          predicates: [Path=/api/github/**]
          filters: [StripPrefix=0]

server:
  port: 8080

agileguard:
  jwt:
    # Injected at deploy-time via env var / Docker secret / K8s secret.
    # Example:  AGILEGUARD_JWT_SECRET=<base64-key>
    secret: ${AGILEGUARD_JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics

logging:
  level:
    com.agileguard: DEBUG
    org.springframework.cloud.gateway: DEBUG
