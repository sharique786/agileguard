# ============================================================
# AgileGuard — API Gateway  |  PRODUCTION environment
# Activated by: -Dspring.profiles.active=prod
#
# Security rules:
#   • JWT secret MUST come from GCP Secret Manager env injection.
#   • Actuator endpoints restricted to internal health checks only.
#   • Debug/trace logging is OFF.
#   • CORS locked to production domain only.
# ============================================================
spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://app.agileguard.example.com"   # production UI domain only
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://agileguard-auth:8081
          predicates: [Path=/api/auth/**, /api/tenants/**, /api/projects/**]
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
        - id: jira-service
          uri: http://agileguard-jira:8082
          predicates: [Path=/api/jira/**]
          filters: [StripPrefix=0]
        - id: onboarding-service
          uri: http://agileguard-auth:8081
          predicates: [Path=/api/onboarding/**]
          filters: [StripPrefix=0]
        - id: admin-service
          uri: http://agileguard-auth:8081
          predicates: [Path=/api/admin/**]
          filters: [StripPrefix=0]
        - id: ai-service
          uri: http://agileguard-ai:8083
          predicates: [Path=/api/ai/**]
          filters: [StripPrefix=0]
        - id: github-service
          uri: http://agileguard-github:8084
          predicates: [Path=/api/github/**]
          filters: [StripPrefix=0]

server:
  port: 8080

agileguard:
  jwt:
    secret: ${AGILEGUARD_JWT_SECRET}     # From GCP Secret Manager at startup

management:
  endpoints:
    web:
      exposure:
        include: health                  # Only health endpoint exposed externally
  endpoint:
    health:
      show-details: never               # Never expose internals publicly

logging:
  level:
    root: WARN
    com.agileguard: INFO
    org.springframework.cloud.gateway: WARN
