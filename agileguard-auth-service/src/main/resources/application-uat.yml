# ============================================================
# AgileGuard — Auth Service  |  UAT environment
# Activated by: -Dspring.profiles.active=uat
#
# Database : PostgreSQL UAT instance (isolated from dev/prod)
# Schema   : validate — Flyway manages migrations in UAT/prod;
#            Hibernate must not change the schema.
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:agileguard_uat}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate        # Hibernate validates schema — Flyway owns migrations
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: false

server:
  port: 8081

agileguard:
  jwt:
    secret: ${AGILEGUARD_JWT_SECRET}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  onboarding:
    enabled: true
    default-plan: FREE
    send-welcome-email: ${ONBOARDING_SEND_EMAIL:false}
    welcome-email-from: ${ONBOARDING_EMAIL_FROM:noreply@uat.agileguard.example.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.agileguard: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
