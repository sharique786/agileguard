# ============================================================
# AgileGuard — JIRA Service
# Default / LOCAL profile  (H2 in-memory, JIRA mock API)
# ============================================================
spring:
  application:
    name: agileguard-jira-service
  profiles:
    active: local
  datasource:
    url: jdbc:h2:mem:jiradb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082

agileguard:
  jira:
    use-mock: true                    # Mock returns 4 realistic sample stories
    base-url: https://your-org.atlassian.net
    user-email: your-email@example.com
    api-token: your-jira-api-token
    aging-threshold-days: 5
    min-description-length: 20
    scan-project-keys: PLAT
    scan-tenant-id: demo
    scan-interval-ms: 900000          # 15 minutes

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.agileguard: DEBUG
