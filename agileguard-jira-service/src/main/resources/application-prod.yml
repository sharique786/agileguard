# ============================================================
# AgileGuard — JIRA Service  |  PRODUCTION environment
# Activated by: -Dspring.profiles.active=prod
#
# JIRA    : Production Atlassian workspace.
#           API token stored in GCP Secret Manager.
# Database: Google Cloud SQL (PostgreSQL) — Flyway migrations.
# Scanning: Reduced interval (30 min) to stay within API limits.
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql:///${DB_NAME:agileguard_prod}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: false

server:
  port: 8082
  forward-headers-strategy: framework

agileguard:
  jira:
    use-mock: false
    base-url: ${JIRA_BASE_URL}
    user-email: ${JIRA_USER_EMAIL}
    api-token: ${JIRA_API_TOKEN}        # GCP Secret Manager
    aging-threshold-days: ${JIRA_AGING_THRESHOLD:5}
    min-description-length: 20
    scan-project-keys: ${JIRA_SCAN_PROJECTS}
    scan-tenant-id: ${JIRA_SCAN_TENANT}
    scan-interval-ms: 1800000           # 30 min in prod (respect JIRA rate limits)

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.agileguard: INFO
